# `firebase-custom-token` validates the Supabase bearer token itself so that its
# handler can answer unauthenticated CORS preflight requests before any auth check.
[functions.firebase-custom-token]
verify_jwt = false

# Called directly by the admin browser UI; it performs its own role check with
# supabase.auth.getUser() and public.profiles before every operation.
[functions.admin-users]
verify_jwt = false
